name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bridge tests (fake plugin, fake Studio MCP)
        run: |
          node scripts/selftest.mjs
          node scripts/studio-mcp-test.mjs

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: --linux AppImage
          - os: windows-latest
            flags: --win
          - os: macos-latest
            flags: --mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npx electron-builder@26.18.0 ${{ matrix.flags }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: studiopilot-${{ matrix.os }}
          path: |
            app/dist/*.AppImage
            app/dist/*.exe
            app/dist/*.zip
            app/dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    # publish whatever built, so a stuck macOS runner doesn't hold back Windows/Linux
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
        continue-on-error: true
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp plugin/StudioPilot.lua out/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "StudioPilot ${GITHUB_REF_NAME#v}" --notes "Builds for Windows, macOS and Linux."
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
